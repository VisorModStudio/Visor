modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
logoFile = "assets/${mod_id}/icon.png"
iconFile = "assets/${mod_id}/icon.png"
authors = "${mod_authors}"
displayTest = "NONE"
description = '''
${mod_description}
'''

[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.sodium.mixins.json"
[[mixins]]
config = "${mod_id}.replaymod.mixins.json"
[[mixins]]
config = "${mod_id}.flashback.mixins.json"
[[mixins]]
config = "${mod_id}.dh.mixins.json"
[[mixins]]
config = "${mod_id}.dynamicfps.mixins.json"
[[mixins]]
config = "${mod_id}.iris.mixins.json"
[[mixins]]
config = "${mod_id}.blur.mixins.json"
[[mixins]]
config = "${mod_id}.aeronautics.mixins.json"
[[mixins]]
config = "${mod_id}.create.mixins.json"
[[mixins]]
config = "${mod_id}.mixins.neoforge.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
mandatory = true
versionRange = "${neoforge_version_range}"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range_forgelike}"
ordering = "AFTER"
side = "BOTH"
