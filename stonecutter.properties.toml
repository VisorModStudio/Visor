# ---- Mod --------------------------------------------------------------------------------------
mod_id = "visor"
mod_name = "Visor"
mod_group = "org.vmstudio"
mod_authors = "PhoenixRa"
mod_description = "Next-Gen VR core mod for Minecraft. Based on OpenXR. Built as a platform. Supports addons, customizing your VR experience"
mod_api_description = "The Visor API. Not a mod! Use only in a development as a dependency."
mod_license = "MPL-2.0"

# ---- Common dependencies ----------------------------------------------------------------------
fabric_loader_version = "0.16.14"
fabric_loader_version_range = ">=0.14.14"
atumvr_source         = "local"   # "local" = <root>/libs, "maven" = external repository
atumvr_version        = "1.14.0beta-snapshot#25"
atumconfig_version    = "1.2.0pre3"
lwjgl_version         = "3.3.6"
mixin_extras_version  = "0.4.1"
# Forge 50 and NeoForge 20.6 ship Mixin 0.8.5, which knows no level above JAVA_18
mixin_compat_level    = 17
lombok_version        = "1.18.46"
jetbrains_annotations_version = "26.1.0"

# ---- Version Targets --------------------------------------------------------------------------
[targets]
"1.20.1" = ["fabric", "forge"]
"1.20.2" = ["fabric", "forge", "neoforge"]
"1.20.4" = ["fabric", "forge", "neoforge"]
"1.20.6" = ["fabric", "forge", "neoforge"]
