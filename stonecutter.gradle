plugins {
    id "dev.kikugie.stonecutter"
}

// Currently used version
// Switch with `gradlew "Set active project to <version>"`,
// go back with `gradlew "Reset active project"`.
stonecutter.active "1.21.5" /* [SC] DO NOT EDIT */

// ------ Versioning ------------------------------------------
def versionPropsFile = rootProject.file("version.properties")
if (!versionPropsFile.exists()) {
    throw new GradleException("Missing ${versionPropsFile}")
}
Properties versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }

def versionPart = { String key, boolean required = true ->
    def value = versionProps[key]?.toString()?.trim()
    if (required && (value == null || value.isEmpty())) {
        throw new GradleException("version.properties is missing '${key}'")
    }
    return value ?: ""
}

def isAlpha    = versionPart("version.alpha").toBoolean()
def stage      = versionPart("version.stage", false)
def major      = versionPart("version.major").toInteger()
def minor      = versionPart("version.minor").toInteger()
def patch      = versionPart("version.patch").toInteger()
def build      = versionPart("version.build").toInteger()

ext.mod_version = (isAlpha
        ? "${major}.${minor}.${patch}${stage}-alpha.${build}"
        : "${major}.${minor}.${patch}${stage}").toString()
logger.lifecycle("Versioning: ${mod_version} (${isAlpha ? 'ALPHA' : 'RELEASE'})")


// ------ Generated build tasks ------------------------------------
def tasksByVersion = new TreeMap()
stonecutter.tree.getBranches().each { branch ->
    def branchName = branch.getId()
    def task = branchName - "visor-" in ["api", "core"] ? "check" : "buildAndCollect"

    branch.getNodes().each { node ->
        def mcVersion = node.getMetadata().getVersion()
        tasksByVersion.computeIfAbsent(mcVersion) { [] } << ":${branchName}:${mcVersion}:${task}"
    }
}
tasksByVersion.each { mcVersion, paths ->
    tasks.register("build-${mcVersion}") {
        group = "build version"
        description = "Builds every loader for Minecraft ${mcVersion} into <root>/build/libs"
        dependsOn paths
    }
}
tasks.register("buildAll") {
    group = "build version"
    description = "Builds every loader for every Minecraft version into <root>/build/libs"
    dependsOn tasksByVersion.values().flatten()
}

// ------ mcversion range files (visor-core mixins) --------------------

project(":visor-core") {
    apply plugin: "idea"
    idea.module.excludeDirs += file("mcversion")
}
def mcversionSwitch = { String version ->
    def core = stonecutter.tree.getBranches().find { it.getId() == "visor-core" }
    def layout = new org.vmstudio.build.McVersionLayout(rootProject.file("visor-core"), core.getVersions()*.getVersion())
    layout.switchTo(version).each { logger.lifecycle("mcversion: ${it}") }
}
def triggersSucceeded = { List<String> names ->
    names.every { name ->
        def trigger = tasks.findByName(name)
        trigger == null || !trigger.state.executed || trigger.state.failure == null
    }
}
tasksByVersion.keySet().each { mcVersion ->
    def triggers = ["Set active project to ${mcVersion}".toString()]
    if (mcVersion == stonecutter.vcsVersion.version) {
        triggers << "Reset active project"
    }
    def switchTask = tasks.register("mcversionSwitch-${mcVersion}") {
        group = "stonecutter"
        description = "Moves the range files for ${mcVersion} into src and parks the others"
        onlyIf { triggersSucceeded(triggers) }
        doLast { mcversionSwitch(mcVersion) }
    }
    tasks.matching { it.name in triggers }.configureEach { finalizedBy switchTask }
}

// ------ StoneCutter parameters --------------------------------------
stonecutter.parameters {
    swaps.put("mod_version", "\"${mod_version}\";")
}
