plugins {
    id "dev.kikugie.stonecutter"
}

// Currently used version
// Switch with `gradlew "Set active project to <version>"`,
// go back with `gradlew "Reset active project"`.
stonecutter.active "26.2" /* [SC] DO NOT EDIT */

// ------ Versioning ------------------------------------------
def versionPropsFile = rootProject.file("version.properties")
if (!versionPropsFile.exists()) {
    throw new GradleException("Missing ${versionPropsFile}")
}
Properties versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }

def versionPart = { String key, boolean required = true ->
    def value = versionProps[key]?.toString()?.trim()
    if (required && (value == null || value.isEmpty())) {
        throw new GradleException("version.properties is missing '${key}'")
    }
    return value ?: ""
}

def isAlpha    = versionPart("version.alpha").toBoolean()
def stage      = versionPart("version.stage", false)
def major      = versionPart("version.major").toInteger()
def minor      = versionPart("version.minor").toInteger()
def patch      = versionPart("version.patch").toInteger()
def build      = versionPart("version.build").toInteger()

ext.mod_version = (isAlpha
        ? "${major}.${minor}.${patch}${stage}-alpha.${build}"
        : "${major}.${minor}.${patch}${stage}").toString()
logger.lifecycle("Versioning: ${mod_version} (${isAlpha ? 'ALPHA' : 'RELEASE'})")


// ------ Generated build tasks ------------------------------------
def tasksByVersion = new TreeMap()
stonecutter.tree.getBranches().each { branch ->
    def branchName = branch.getId()
    def task = branchName - "visor-" in ["api", "core"] ? "check" : "buildAndCollect"

    branch.getNodes().each { node ->
        def mcVersion = node.getMetadata().getVersion()
        tasksByVersion.computeIfAbsent(mcVersion) { [] } << ":${branchName}:${mcVersion}:${task}"
    }
}
tasksByVersion.each { mcVersion, paths ->
    tasks.register("build-${mcVersion}") {
        group = "build version"
        description = "Builds every loader for Minecraft ${mcVersion} into <root>/build/libs"
        dependsOn paths
    }
}
tasks.register("buildAll") {
    group = "build version"
    description = "Builds every loader for every Minecraft version into <root>/build/libs"
    dependsOn tasksByVersion.values().flatten()
}

// ------ mcversion range files (visor-core mixins) --------------------

project(":visor-core") {
    apply plugin: "idea"
    idea.module.excludeDirs += file("mcversion")
}
def switchTaskType = dev.kikugie.stonecutter.controller.task.StonecutterSwitchTask
def mcversionLayout = {
    def core = stonecutter.tree.getBranches().find { it.getId() == "visor-core" }
    new org.vmstudio.build.McVersionLayout(rootProject.file("visor-core"), core.getVersions()*.getVersion())
}
def mcversionMove = tasks.register("mcversionMove") {
    group = "stonecutter"
    description = "Moves the range files covering the version switched to into visor-core/src and parks the others"
    outputs.dirs(file("visor-core/src/main/java"), file("visor-core/mcversion"))
    outputs.upToDateWhen { false }
    doLast {
        def versions = gradle.taskGraph.allTasks.findAll { switchTaskType.isInstance(it) }.collect { it.version.get() }.unique()
        if (versions.size() != 1) {
            throw new GradleException("mcversionMove needs exactly one Stonecutter switch, found ${versions}")
        }
        mcversionLayout().moveTo(versions[0]).each { logger.lifecycle("mcversion: ${it}") }
    }
}
def mcversionSwitch = tasks.register("mcversionSwitch") {
    group = "stonecutter"
    description = "Resyncs the range files with the active version and keeps the parked ones in the form of their range"
    outputs.dirs(file("visor-core/src/main/java"), file("visor-core/mcversion"))
    outputs.upToDateWhen { false }
    doLast {
        def active = org.vmstudio.build.McVersionLayout.activeVersion(rootDir)
        mcversionLayout().switchTo(active).each { logger.lifecycle("mcversion: ${it}") }
    }
}
tasks.withType(switchTaskType).configureEach { finalizedBy mcversionSwitch }
// Stonecutter renders src for the switch in stonecutterPrepare of the target node: range files move in before it
gradle.projectsEvaluated {
    def requested = gradle.startParameter.taskNames
            .findAll { it ==~ /:?(stonecutterSwitchTo.+|(Set|Reset|Refresh) active project.*)/ }
            .collect { tasks.findByName(it.startsWith(":") ? it.substring(1) : it) }.findAll()
    (requested + requested.collectMany { it.taskDependencies.getDependencies(it) as List })
            .findAll { switchTaskType.isInstance(it) }
            .collect { it.version.get() }.unique()
            .each { version -> project(":visor-core:${version}").tasks.named("stonecutterPrepare") { dependsOn mcversionMove } }
}

// ------ StoneCutter parameters --------------------------------------
stonecutter.parameters {
    swaps.put("mod_version", "\"${mod_version}\";")
    // Pure renames and package moves (ResourceLocation -> Identifier, ...): see McVersionRenames
    org.vmstudio.build.McVersionRenames.RULES.each { rule ->
        replacements.regex(rule.forward(current.version)) {
            replace(rule.oldPattern, rule.newText, rule.newPattern, rule.oldText)
        }
    }
}
