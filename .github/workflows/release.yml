name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach jars to
        type: string
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    name: Discover version branches
    uses: ./.github/workflows/discover.yml

  build:
    name: Build ${{ matrix.branch }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.discover.outputs.branches) }}
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Compute safe branch name
        id: safe
        run: echo "name=$(echo '${{ matrix.branch }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Collect release jars
        id: collect
        run: |

          PLATFORMS=$(grep -oP '^enabled_platforms\s*=\s*\K.*' gradle.properties | tr -d '[:space:]')

          mkdir -p release-assets

          if [ -z "$PLATFORMS" ]; then
            echo "::warning::Branch ${{ matrix.branch }}: could not resolve enabled_platforms from gradle.properties. This branch doesn't match the expected layout — skipping jar collection for it."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "platforms=$PLATFORMS"

          any_found=0
          IFS=',' read -ra PLATS <<< "$PLATFORMS"
          for p in "${PLATS[@]}"; do
            p=$(echo "$p" | tr -d '[:space:]')
            [ -z "$p" ] && continue
            found=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              # gradle already names jars <base>-<modver>+mc<mc>-<loader>.jar; publish.yml parses that
              name=$(basename "$f")
              case "$name" in
                *+mc*-"$p".jar) ;;
                *) echo "::warning::Jar '$name' is not <base>-<modver>+mc<mc>-$p.jar — publish.yml will skip it" ;;
              esac
              # gh release upload reads assets as `file#label`, so '#' must not reach the name
              name=$(printf '%s' "$name" | tr -c 'A-Za-z0-9._+-' '.')
              cp "$f" "release-assets/$name"
              echo "  $f -> release-assets/$name"
              found=1
              any_found=1
            done < <(find . -path "*/visor-${p}/build/libs/*.jar" ! -name '*-dev.jar' ! -name '*-sources.jar')
            if [ "$found" -eq 0 ]; then
              echo "::warning::No release jar found for platform '$p' on branch ${{ matrix.branch }}"
            fi
          done

          echo "Assets:"
          ls -la release-assets/

          if [ "$any_found" -eq 0 ]; then
            echo "::warning::No release jars collected on branch ${{ matrix.branch }}"
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload jars to the release
        if: steps.collect.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" release-assets/*.jar \
            --repo "${{ github.repository }}" --clobber

      - name: Upload build artifacts (traceability)
        if: steps.collect.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.safe.outputs.name }}
          path: release-assets/*.jar
          retention-days: 14
          if-no-files-found: error