/*
 * Plugin applied to EVERY versioned subproject (":visor-api:<mc>", ":visor-core:<mc>",
 * ":visor-fabric:<mc>" etc).
 */
plugins {
    id "java-library"
}

// ---- Identity -----------------------------------------------------------------------------
def minecraftVersion = stonecutter.current.version
project.ext.minecraft_version = minecraftVersion
project.ext.branch = project.parent.name - "visor-" // remove "visor-" prefix

// ---- Loom ---------------------------------------------------------------------------------
def unobfuscated = stonecutter.eval(minecraftVersion, ">=26.1")
project.ext.unobfuscated = unobfuscated
pluginManager.apply(unobfuscated ? "dev.architectury.loom-no-remap" : "dev.architectury.loom")


group = "${mod_group}.${mod_id}.${branch}"

base.archivesName = mod_name.toString().replaceAll("\\s+", "")
// release.yml / publish.yml parse this shape, keep the "+mc" marker
version = "${mod_version}+mc${minecraftVersion}-${branch}"

// ---- Java ---------------------------------------------------------------------------------
def javaVersion = java_version as int
java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = javaVersion
}

// ---- Clean archives -----------------------------------------------------------------------
def archivePrefix = "${base.archivesName.get()}-${version}"
tasks.register("cleanStaleJars", Delete) {
    description = "Deletes archives of other versions from build/libs and build/devlibs"
    delete(["libs", "devlibs"].collect { dirName ->
        fileTree(layout.buildDirectory.dir(dirName)) {
            include "*.jar"
            exclude "${archivePrefix}.jar", "${archivePrefix}-*.jar"
        }
    })
}
tasks.withType(AbstractArchiveTask).configureEach { mustRunAfter "cleanStaleJars" }
tasks.named("assemble") { dependsOn "cleanStaleJars" }

// ---- Repositories -------------------------------------------------------------------------
repositories {
    mavenCentral()
    maven { name = "Fabric"; url = "https://maven.fabricmc.net/" }
    maven { name = "Architectury"; url = "https://maven.architectury.dev/" }
    maven { name = "Forge"; url = "https://maven.minecraftforge.net/" }
    maven { name = "NeoForge"; url = "https://maven.neoforged.net/releases/" }
    maven { name = "Mojang"; url = "https://libraries.minecraft.net/" }
    maven { name = "Parchment"; url = "https://maven.parchmentmc.org" }
    maven { name = "JitPack"; url = "https://jitpack.io" }
    maven { name = "Sonatype"; url = "https://oss.sonatype.org/content/repositories/snapshots/" }
    maven { name = "Redempt"; url = "https://redempt.dev" }

    // ---- LOCAL DEPENDENCY: the AtumVR jars in <root>/libs
    flatDir { dirs rootProject.file("libs") }
    // ----

    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

// ---- AtumVR ------------------------------------------------------------------------------
if (!(atumvr_source in ["local", "maven"])) {
    throw new GradleException("atumvr_source must be \"local\" or \"maven\", got \"${atumvr_source}\"")
}
project.ext.atumvr = { String module ->
    atumvr_source == "local"
            ? [name: "atumvr-${module}-${atumvr_version}"]
            : "com.github.Phoenix-Ra.AtumVR:atumvr-${module}:${atumvr_version}"
}

// ---- Minecraft ----------------------------------------------------------------------------
project.ext.visorAccessWidener = stonecutter.process(
        rootProject.file("visor-api/src/main/resources/visor.accesswidener"),
        "build/visor.accesswidener")

loom {
    silentMojangMappingsLicense()
    accessWidenerPath = visorAccessWidener
    if (!unobfuscated) {
        mixin {
            // At runtime Fabric uses "intermediary" names and Forge uses "SRG" names,
            // not the Mojang names used by mod.
            // Mixin needs a "refmap" to translate its targets. Loom generates it.
            useLegacyMixinAp = true
            defaultRefmapName = "${mod_id}.refmap.json"
        }
    }
}

if (unobfuscated) {
    ["Api", "Implementation", "CompileOnly"].each { bucket ->
        def mod = configurations.create("mod${bucket}") {
            canBeConsumed = false
            canBeResolved = false
        }
        configurations.named(bucket.uncapitalize()) { extendsFrom mod }
    }
    configurations.register("namedElements") {
        canBeConsumed = true
        canBeResolved = false
        extendsFrom configurations.api
    }
    artifacts.add("namedElements", tasks.named("jar"))
}


dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    if (!unobfuscated) {
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${minecraftVersion}:${parchment_version}@zip")
        }
    }

    compileOnly "org.projectlombok:lombok:${lombok_version}"
    annotationProcessor "org.projectlombok:lombok:${lombok_version}"
    compileOnly "org.jetbrains:annotations:${jetbrains_annotations_version}"

    // Natives
    compileOnly "org.lwjgl:lwjgl-openxr:${lwjgl_version}"
    compileOnly "org.lwjgl:lwjgl-vulkan:${lwjgl_version}"
}

// ---- Version-range sources (visor-core mixins only) ---------------------------------------
project.ext.mcversionCoreLayout = {
    def core = rootProject.project(":visor-core")
    new org.vmstudio.build.McVersionLayout(core.projectDir, core.subprojects*.name.findAll { it ==~ /\d+(\.\d+)+/ })
}
if (project.parent.name == "visor-core") {
    def mcversion = mcversionCoreLayout()
    afterEvaluate {
        // after Stonecutter registered its own source directories
        sourceSets.main.java.exclude(mcversion.excludeSpec(minecraftVersion))
        def parked = mcversion.parkedSources(project, minecraftVersion)
        tasks.named("compileJava") { source(parked) }
    }
    tasks.register("checkMcversionLayout") {
        description = "Verifies the range headers, the parked copies and the absence of Stonecutter markers in range files"
        def active = org.vmstudio.build.McVersionLayout.activeVersion(rootProject.projectDir)
        doLast {
            def problems = mcversion.check(active)
            if (problems) {
                throw new GradleException("mcversion layout of visor-core:\n  " + problems.join("\n  "))
            }
        }
    }
    tasks.named("check") { dependsOn "checkMcversionLayout" }
}

// ---- Resources --------------------------------------------------------------
// 1.21.9 pack.mcmeta, one file for the resource side (format 69+) and the data side (88+): with min_format at or
// below the last pre-minor format of both (64 resources, 81 data) each side accepts, and then requires,
// pack_format + supported_formats + min_format/max_format, the range covering its own current format.
// min/max alone is rejected by the data side, supported_formats with a min above 64 by the resource side.
def packFormatFields = stonecutter.eval(minecraftVersion, ">=1.21.9")
        ? "\"pack_format\": ${pack_format},\n    \"supported_formats\": [64, ${data_pack_format}],\n" +
          "    \"min_format\": 64,\n    \"max_format\": ${data_pack_format}"
        : "\"pack_format\": ${pack_format}"

project.ext.resourcePlaceholders = [
        mod_id                           : mod_id,
        mod_name                         : mod_name,
        mod_version                      : mod_version,
        mod_authors                      : mod_authors,
        mod_description                  : mod_description,
        mod_api_description              : mod_api_description,
        mod_license                      : mod_license,
        minecraft_version                : minecraftVersion,
        java_version                     : java_version,
        mixin_compat_level               : mixin_compat_level,
        pack_format                      : pack_format,
        pack_format_fields               : packFormatFields,
        fabric_loader_version            : fabric_loader_version,
        fabric_loader_version_range      : fabric_loader_version_range,
        minecraft_version_range_fabric   : minecraft_version_range_fabric,
        minecraft_version_range_forgelike: minecraft_version_range_forgelike,
        forge_version_range              : findProperty("forge_version_range") ?: "",
        neoforge_version_range           : findProperty("neoforge_version_range") ?: "",
]

processResources {
    inputs.properties(resourcePlaceholders)
    filesMatching(["fabric.mod.json", "META-INF/*.toml", "pack.mcmeta"]) {
        expand(resourcePlaceholders)
    }

    filesMatching(["*.mixins.json", "*.mixins.*.json"]) {
        filter { String line ->
            if (unobfuscated && line.contains('"refmap"')) {
                return null
            }
            resourcePlaceholders.inject(line) { l, key, value -> l.replace('${' + key + '}', value.toString()) }
        }
    }

    // 1.21.2 resolves shader stages by resource id
    if (stonecutter.eval(minecraftVersion, ">=1.21.2")) {
        filesMatching("assets/minecraft/shaders/core/vr_*.json") {
            filter { String line ->
                line.replaceAll(/"(vertex|fragment)": "(vr_[a-z_]+)"/, '"$1": "minecraft:core/$2"')
            }
        }
    }
}
