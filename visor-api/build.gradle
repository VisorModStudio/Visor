plugins {
    id 'maven-publish'
}

loom{
    accessWidenerPath = file("src/main/resources/visor.accesswidener")
}
dependencies {
    // @Environment annotation and mixin extras
    modImplementation(libs.fabric.loader)

    api(libs.atumvr.api)
    api(libs.atumvr.core)
}
publishing {
    publications {
        // replace the “components.java” publication with a remapped jar
        remappedApi(MavenPublication) {
            artifact(tasks.remapJar) {
                classifier = ""
            }
            artifact(tasks.sourcesJar)
        }
    }
}