// Build script of every ":visor-core:<mc>" subproject.
plugins {
    id "visor.minecraft"
}

dependencies {
    compileOnly project(path: ":visor-api:${minecraft_version}", configuration: "namedElements")

    // Compile-time stubs, never shipped
    compileOnly project(":visor-core:stubs")

    // @Environment annotation and mixin extras
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"

    modApi atumvr("core")
    implementation "com.github.Phoenix-Ra:AtumConfiguration:${atumconfig_version}"

    // Optional mods the core mixins target
    modCompileOnly "maven.modrinth:sodium:${sodium_version}"
    modCompileOnly("maven.modrinth:iris:${iris_version}") { transitive = false }

    testImplementation(platform("org.junit:junit-bom:5.10.2"))
    testImplementation("org.junit.jupiter:junit-jupiter")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    testImplementation("org.joml:joml:1.10.5")
}

test {
    useJUnitPlatform()
}

// The core sources are compiled into each loader jar, this node only type-checks them.
if (!unobfuscated) {
    tasks.named("remapJar") { enabled = false }
    tasks.named("remapSourcesJar") { enabled = false }
}

configurations {
    coreJava      { canBeConsumed = true; canBeResolved = false }
    coreResources { canBeConsumed = true; canBeResolved = false }
}
afterEvaluate {
    def generate = tasks.named("stonecutterGenerate")
    sourceSets.main.java.srcDirs.each { dir -> artifacts.add("coreJava", dir) { builtBy generate } }
    sourceSets.main.resources.srcDirs.each { dir -> artifacts.add("coreResources", dir) { builtBy generate } }
}
